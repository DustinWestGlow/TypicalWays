<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScoreKeeper (Self)</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    
    <div id="page-container" class="">
      <div id="container" class="">
        <div id="image-wrapper">
          <img id="image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTeJndQFl2vlPIU6WkKf2M_6GM-Eec_vlv94ipxPTM_lg&s=10">
        </div>
        <div id="title">
          Ping Pong Score Keeper
        </div>
        <div id="body">
          <div id="score">
            <span id="score_one">0</span>
            to
            <span id="score_two">0</span>
          </div>
          <div>
            Use the buttons below to keep score.
          </div>
          <div id="max-wrapper">
            Playing to
            <div class="dropdown d-inline">
              <button class="btn btn-dark dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                3
              </button>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">3</a></li>
                <li><a class="dropdown-item" href="#">4</a></li>
                <li><a class="dropdown-item" href="#">5</a></li>
              </ul>
            </div>
          </div>
        </div>
        <div id="buttons" class="">
          <div id="player_one" class="button-wrapper">
            +1 Player One
          </div>
          <div id="player_two" class="button-wrapper">
            +1 Player Two
          </div>
          <div id="reset" class="button-wrapper">
            Reset
          </div>
        </div>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="text/javascript" src="script_3.js"></script>
  </body>
</html>
