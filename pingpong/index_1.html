<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScoreKeeper (Self)</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    
    <div id="page-container" class="container-fluid row">
      <div id="container" class="col">
        <div id="image">
          
        </div>
        <div id="title">
          Ping Pong Score Keeper
        </div>
        <div id="body">
          <div id="score">
            0 to 0
          </div>
          <div>
            Use the buttons below to keep score.
          </div>
          <div id="max-wrapper">
            Playing to <span id="max"></span>
          </div>
        </div>
        <div id="buttons" class="row">
          <div class="col col-4">
            <button id="player_one">
              +1 Player One
            </button>
          </div>
          <div class="col col-4">
            <button id="player_two">
              +1 Player Two
            </button>
          </div>
          <div class="col col-4">
            <button id="reset">
              Reset
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <script type="text/javascript" src="script.js"></script>
  </body>
</html>
